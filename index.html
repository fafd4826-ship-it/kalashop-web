<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 16px; background: #0a0a0a; color: #eee; margin: 0; }
    h1 { font-size: 22px; margin-bottom: 16px; font-weight: 800; text-align: center; color: #fff;}
    input, select { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #eee; box-sizing: border-box; font-size: 14px; outline: none;}
    input:focus, select:focus { border-color: #2ea6ff; }
    .tab-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #aaa; cursor: pointer; white-space: nowrap; font-size: 14px; transition: 0.2s;}
    .tab-btn.active { background: #2ea6ff; color: #fff; border-color: #2ea6ff; font-weight: bold;}
  </style>
</head>
<body>
  <h1>Магазин Калашовского</h1>
  <div style="display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px;">
    <button class="tab-btn active" onclick="switchTab('all', this)">Все</button>
    <button class="tab-btn" onclick="switchTab('new', this)">Новорег</button>
    <button class="tab-btn" onclick="switchTab('aged', this)">С отлегой</button>
    <button class="tab-btn" onclick="switchTab('premium', this)">Premium</button>
  </div>
  
  <input id="search" placeholder="Поиск по стране (например, US или Россия)">
  
  <select id="sort" onchange="load()">
    <option value="default">Сортировка: по умолчанию</option>
    <option value="low">Сначала дешевые</option>
    <option value="high">Сначала дорогие</option>
  </select>

  <div id="list"></div>
  
  <!-- Кэш сброшен на версию 11 -->
  <script src="app.js?v=11"></script>
</body>
</html>
