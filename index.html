<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #0f0f0f; color: #eee; margin: 0; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #eee; box-sizing: border-box; }
    .tab-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #aaa; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #2ea6ff; color: #fff; border-color: #2ea6ff; }
  </style>
</head>
<body>
  <h1>Аккаунты от Калашовского</h1>
  <div style="display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto;">
    <button class="tab-btn active" onclick="switchTab('all', this)">Все</button>
    <button class="tab-btn" onclick="switchTab('new', this)">Новорег</button>
    <button class="tab-btn" onclick="switchTab('aged', this)">С отлегой</button>
    <button class="tab-btn" onclick="switchTab('premium', this)">Аккаунты с премиум</button>
  </div>
  <input id="search" placeholder="Страна или код (например, +7 или Россия)">
  <div id="list"></div>
  <script src="app.js"></script>
</body>
</html>
